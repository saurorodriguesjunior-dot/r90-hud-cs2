<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R90 HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #e6165a; --accent: #ffd23f; --ct: #4aa3ff; --t: #ffb02e; --text: #fff;
    --panel: rgba(13,15,23,.88); --panel-solid: #0d0f17; --teamA: #2f7bff; --teamB: #ff8a1f;
    --font: 'Saira Semi Condensed', 'Arial Narrow', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }

  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .hidden { display: none !important; }
  .fade { transition: opacity .35s ease, transform .35s ease; }

  /* ---------- Placar ---------- */
  #scoreboard { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .sb-main { display: flex; align-items: stretch; height: 84px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  .sb-team { display: flex; align-items: center; gap: 14px; background: var(--panel); padding: 0 18px; width: 380px; position: relative; overflow: hidden; }
  .sb-team.left { justify-content: flex-start; clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%); }
  .sb-team.right { justify-content: flex-end; flex-direction: row-reverse; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%); }
  .sb-team::before { content: ''; position: absolute; top: 0; bottom: 0; width: 6px; background: var(--side-color); }
  .sb-team.left::before { right: 0; }
  .sb-team.right::before { left: 0; }
  .sb-team::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--team-color), transparent 70%); opacity: .28; pointer-events: none; }
  .sb-team.right::after { background: linear-gradient(270deg, var(--team-color), transparent 70%); }
  .shield { width: 60px; height: 64px; flex: none; display: grid; place-items: center; position: relative; z-index: 1; }
  .shield-svg, .shield-img { width: 100%; height: 100%; object-fit: contain; }
  .sb-names { display: flex; flex-direction: column; min-width: 0; flex: 1; position: relative; z-index: 1; }
  .sb-team.right .sb-names { align-items: flex-end; text-align: right; }
  .sb-name { font-size: 32px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
  .sb-side { font-size: 15px; font-weight: 500; letter-spacing: 2px; color: var(--side-color); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 10px; height: 10px; border: 2px solid rgba(255,255,255,.6); transform: skewX(-12deg); }
  .dots i.on { background: var(--accent); border-color: var(--accent); }
  .sb-score { font-size: 64px; font-weight: 600; line-height: 84px; width: 74px; text-align: center; position: relative; z-index: 1; }

  .sb-center { width: 150px; background: var(--panel-solid); display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 4px solid var(--primary); }
  .sb-timer { font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .sb-round { font-size: 15px; font-weight: 500; letter-spacing: 2px; opacity: .75; margin-top: 4px; text-transform: uppercase; }
  .sb-center.bomb { background: #b3121f; border-bottom-color: #ff4a4a; animation: pulse 1s infinite; }
  .sb-center.defuse { background: #12509e; border-bottom-color: var(--ct); }
  @keyframes pulse { 50% { background: #7d0d16; } }

  .sb-strip { display: flex; align-items: center; gap: 12px; margin-top: 6px; background: var(--panel); padding: 5px 16px; font-size: 18px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 100%, 0 100%); }
  .sb-strip img.org { height: 22px; }
  .badge-amador { background: var(--accent); color: #111; padding: 2px 10px; font-weight: 600; }
  .sb-strip .sep { opacity: .35; }

  .bombbar { width: 100%; height: 6px; background: rgba(0,0,0,.5); margin-top: 4px; overflow: hidden; }
  .bombbar i { display: block; height: 100%; background: #ff3b3b; transition: width .1s linear; }

  #roundEnd { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); padding: 10px 40px; font-size: 34px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; background: var(--win-color, var(--primary)); color: #fff; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 100%, 0 100%); box-shadow: 0 8px 24px rgba(0,0,0,.4); }

  /* ---------- Jogadores ---------- */
  .team-players { position: absolute; display: flex; gap: 6px; }
  .pcard { position: relative; background: var(--panel); overflow: hidden; color: var(--text); }
  .pcard .hp-bar { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--side-color), transparent); opacity: .35; transition: width .3s ease; }
  .pcard .lost { position: absolute; top: 0; bottom: 0; background: rgba(255,60,60,.55); transition: width .9s ease .25s, left .3s ease; }
  .pcard > .in { position: relative; z-index: 1; }
  .pcard .line { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pname { font-weight: 500; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .php { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pweap { font-weight: 600; opacity: .9; overflow: hidden; text-overflow: ellipsis; }
  .pmoney { color: #7dff9c; font-weight: 500; font-variant-numeric: tabular-nums; }
  .pkd { opacity: .8; font-variant-numeric: tabular-nums; }
  .slot { background: var(--side-color); color: #111; font-weight: 600; width: 20px; text-align: center; flex: none; }
  .nades { display: flex; gap: 2px; align-items: center; }
  .nade { font-size: 11px; font-weight: 600; padding: 0 4px; background: rgba(255,255,255,.14); line-height: 16px; }
  .nade.HE { color: #ff8c6b; } .nade.FL { color: #fff7a8; } .nade.SM { color: #cfd6e6; } .nade.MO, .nade.IN { color: #ffb02e; } .nade.DC { color: #a8a8a8; }
  .tag { font-size: 11px; font-weight: 600; padding: 0 5px; line-height: 16px; }
  .tag.kit { background: var(--ct); color: #071a33; }
  .tag.c4 { background: #ff3b3b; color: #fff; }
  .armor { display: inline-flex; gap: 1px; opacity: .9; }

  /* Ícones de armas: a da mão acesa, as guardadas apagadas; o time da direita aponta para o centro */
  .pweap { display: inline-flex; align-items: center; gap: 6px; overflow: visible !important; }
  .wico { display: inline-grid; place-items: center; height: 20px; width: 54px; flex: none; color: #fff; transition: opacity .2s ease, color .2s ease; }
  .wico svg, .wico img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.55)); }
  .wico.off { opacity: .38; width: 40px; height: 15px; }
  .wico.on { color: #fff; }
  .wico.small { width: 30px; height: 16px; }
  .wico-nade.small, .wico-nade { width: 18px; }
  #playersRight .wico svg, #playersRight .wico img { transform: scaleX(-1); }
  .layout-horizontal .wico { width: 50px; height: 18px; }
  .layout-horizontal .wico.off { width: 34px; height: 13px; }
  .layout-vertical .wico { width: 62px; height: 22px; }
  .layout-vertical .wico.off { width: 44px; height: 16px; }
  #observed .ob-weap { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #observed .ob-bottom { white-space: nowrap; gap: 10px; }
  #observed .ob-hp { white-space: nowrap; flex: none; }
  .layout-horizontal #observed { width: 380px; }
  .layout-horizontal #observed .ob-hp .bar { width: 64px; }
  .layout-horizontal #observed .ob-wname { display: none; }
  #observed .wico.big { width: 82px; height: 28px; }
  #observed .ob-wname { font-size: 15px; opacity: .75; }
  #observed .ob-ammo { font-size: 16px; opacity: .8; font-variant-numeric: tabular-nums; }
  #observed .ob-ammo b { font-size: 22px; font-weight: 600; opacity: 1; }

  /* Ícones dos itens */
  .ico { display: inline-grid; place-items: center; width: 17px; height: 17px; flex: none; color: #dfe7f1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .ico svg { width: 100%; height: 100%; display: block; }
  .ico-HE { color: #9fd36b; }
  .ico-FL { color: #f4f1d6; }
  .ico-SM { color: #c9d3e0; }
  .ico-MO, .ico-IN { color: #d6dde7; }
  .ico-DC { color: #9aa6b4; }
  .ico-armor, .ico-helmet { color: #cfd8e3; width: 15px; height: 15px; }
  .ico.badge { width: 22px; height: 18px; border-radius: 5px; padding: 1px 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 0 rgba(0,0,0,.35); filter: none; }
  .ico-kit.badge { background: var(--ct); color: #06203f; }
  .ico-c4.badge { background: #e5323b; color: #fff; }
  .layout-vertical .ico { width: 22px; height: 22px; }
  .layout-vertical .ico.badge { width: 26px; height: 21px; }
  .layout-vertical .ico-armor, .layout-vertical .ico-helmet { width: 18px; height: 18px; }
  .layout-horizontal .ico { width: 18px; height: 18px; }
  #observed .ob-armor { display: inline-flex; align-items: center; gap: 3px; }
  #observed .ico { width: 18px; height: 18px; }
  .pcard.dead { opacity: .5; }
  .pcard.dead .hp-bar { width: 0 !important; }
  .pcard.observed { outline: 3px solid var(--accent); outline-offset: -3px; }
  .pcard.flashed .in { filter: brightness(1.6); }
  .side-CT { --side-color: var(--ct); }
  .side-T { --side-color: var(--t); }

  /* Layout horizontal: cartões na parte de baixo */
  .layout-horizontal .team-players { bottom: 14px; }
  .layout-horizontal #playersLeft { left: 18px; }
  .layout-horizontal #playersRight { right: 18px; }
  .layout-horizontal .pcard { width: 142px; height: 96px; border-top: 4px solid var(--side-color); }
  .layout-horizontal .pcard > .in { padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; }
  .layout-horizontal .pcard .hp-bar { top: auto; height: 100%; background: linear-gradient(0deg, var(--side-color), transparent); }
  .layout-horizontal .pname { font-size: 19px; }
  .layout-horizontal .php { font-size: 22px; }
  .layout-horizontal .pweap { font-size: 15px; }
  .layout-horizontal .pmoney, .layout-horizontal .pkd { font-size: 15px; }

  /* Layout vertical: linhas empilhadas nas laterais */
  .layout-vertical .team-players { bottom: 18px; flex-direction: column; }
  .layout-vertical #playersLeft { left: 14px; }
  .layout-vertical #playersRight { right: 14px; }
  .layout-vertical .pcard { width: 400px; height: 62px; }
  .layout-vertical #playersLeft .pcard { border-left: 5px solid var(--side-color); }
  .layout-vertical #playersRight .pcard { border-right: 5px solid var(--side-color); }
  .layout-vertical #playersRight .hp-bar { left: auto; right: 0; background: linear-gradient(270deg, var(--side-color), transparent); }
  .layout-vertical .pcard > .in { padding: 5px 10px; display: grid; grid-template-columns: 1fr auto; align-content: center; column-gap: 12px; row-gap: 2px; height: 100%; }
  .layout-vertical .pcard .line:first-child { grid-column: 1 / -1; }
  .layout-vertical #playersRight .pcard > .in { grid-template-columns: auto 1fr; }
  .layout-vertical #playersRight .line:nth-child(2) { grid-column: 2; grid-row: 2; }
  .layout-vertical #playersRight .line:nth-child(3) { grid-column: 1; grid-row: 2; }
  .layout-vertical #playersRight .line { flex-direction: row-reverse; text-align: right; }
  .layout-vertical .pname { font-size: 22px; }
  .layout-vertical .php { font-size: 24px; width: 40px; text-align: center; }
  .layout-vertical .pweap { font-size: 16px; }
  .layout-vertical .pmoney, .layout-vertical .pkd { font-size: 16px; }

  /* ---------- Jogador observado ---------- */
  #observed { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: 340px; background: var(--panel); border-bottom: 5px solid var(--side-color); filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  .layout-vertical #observed { width: 460px; }
  #observed .ob-top { display: flex; align-items: center; gap: 10px; padding: 8px 14px 4px; }
  #observed .ob-name { font-size: 30px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #observed .ob-team { font-size: 14px; font-weight: 500; letter-spacing: 2px; color: var(--side-color); text-transform: uppercase; }
  #observed .ob-stats { display: grid; grid-template-columns: repeat(4, 1fr); padding: 2px 14px 6px; text-align: center; }
  #observed .ob-stats b { display: block; font-size: 26px; font-weight: 600; line-height: 1; }
  #observed .ob-stats span { font-size: 12px; letter-spacing: 2px; opacity: .65; }
  #observed .ob-bottom { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 8px; background: rgba(0,0,0,.25); font-size: 18px; font-weight: 500; }
  #observed .ob-hp { display: flex; align-items: center; gap: 8px; }
  #observed .ob-hp .bar { width: 90px; height: 8px; background: rgba(255,255,255,.15); }
  #observed .ob-hp .bar i { display: block; height: 100%; background: var(--side-color); }

  /* ---------- Patrocinadores ---------- */
  #sponsors { position: absolute; top: 18px; left: 18px; width: 250px; height: 92px; background: var(--panel); display: grid; place-items: center; overflow: hidden; border-left: 5px solid var(--primary); }
  #sponsors .lbl { position: absolute; top: 4px; left: 8px; font-size: 11px; letter-spacing: 2px; opacity: .6; font-weight: 500; }
  #sponsors img { max-width: 200px; max-height: 58px; object-fit: contain; margin-top: 8px; transition: opacity .5s ease; }

  /* ---------- Veto ---------- */
  #veto { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; }
  .veto-box { width: 1100px; background: var(--panel-solid); border-top: 6px solid var(--primary); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .veto-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .veto-head h1 { font-size: 40px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  .veto-head .sub { font-size: 20px; opacity: .7; letter-spacing: 1px; text-transform: uppercase; }
  .veto-teams { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; text-transform: uppercase; }
  .veto-teams .shield { width: 44px; height: 48px; }
  .veto-list { padding: 14px 32px 26px; display: grid; gap: 8px; }
  .veto-row { display: grid; grid-template-columns: 52px 300px 140px 1fr 200px; align-items: center; gap: 16px; background: rgba(255,255,255,.04); padding: 10px 16px; font-size: 24px; font-weight: 500; text-transform: uppercase; border-left: 5px solid var(--row-color, #666); }
  .veto-row .n { opacity: .5; font-size: 20px; }
  .veto-row .who { display: flex; align-items: center; gap: 10px; }
  .veto-row .who .shield { width: 34px; height: 38px; }
  .veto-row .act { font-size: 18px; letter-spacing: 2px; padding: 2px 10px; text-align: center; }
  .veto-row .act.ban { background: rgba(255,59,59,.2); color: #ff7b7b; }
  .veto-row .act.pick { background: rgba(125,255,156,.18); color: #7dff9c; }
  .veto-row .act.decider { background: rgba(255,210,63,.2); color: var(--accent); }
  .veto-row .map { font-size: 30px; font-weight: 600; }
  .veto-row.ban .map { text-decoration: line-through; opacity: .55; }
  .veto-row .side { font-size: 18px; opacity: .8; text-align: right; }

  /* ==========================================================
     Profundidade: cantos redondos, brilho no topo, sombra embaixo.
     Parece em relevo sem ser 3D. Ajuste os valores aqui.
     ========================================================== */
  :root {
    --radius: 14px;
    --radius-sm: 10px;
    --gloss: linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 38%, rgba(0,0,0,0) 55%, rgba(0,0,0,.22) 100%);
    --depth:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -3px 0 rgba(0,0,0,.35),
      inset 0 0 0 1px rgba(255,255,255,.06),
      0 3px 0 rgba(0,0,0,.35),
      0 12px 26px rgba(0,0,0,.45);
  }
  body { text-shadow: 0 1px 2px rgba(0,0,0,.45); }

  .sb-main { filter: none; border-radius: var(--radius); overflow: hidden; box-shadow: var(--depth); position: relative; }
  .sb-main::after { content: ''; position: absolute; inset: 0; background: var(--gloss); pointer-events: none; z-index: 2; border-radius: inherit; }
  .sb-team.left, .sb-team.right { clip-path: none; }
  .sb-center { border-bottom-width: 0; box-shadow: inset 0 -4px 0 var(--primary); }
  .sb-center.bomb { box-shadow: inset 0 -4px 0 #ff4a4a; }
  .sb-center.defuse { box-shadow: inset 0 -4px 0 var(--ct); }
  .shield { filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); }
  .dots i { border-radius: 3px; transform: none; }

  .sb-strip { clip-path: none; border-radius: var(--radius-sm); margin-top: 8px; box-shadow: var(--depth); background-image: var(--gloss); }
  .badge-amador { border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 rgba(0,0,0,.35); text-shadow: none; }
  .bombbar { border-radius: 4px; }

  #roundEnd { clip-path: none; border-radius: var(--radius); box-shadow: var(--depth); background-image: var(--gloss); }

  .pcard { border-radius: var(--radius-sm); box-shadow: var(--depth); }
  .pcard::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--gloss); pointer-events: none; z-index: 2; }
  .pcard.observed { outline: none; box-shadow: var(--depth), inset 0 0 0 3px var(--accent), 0 0 18px rgba(255,210,63,.35); }
  .slot { border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); text-shadow: none; }
  .nade, .tag { border-radius: 4px; text-shadow: none; }

  /* Cartões mais altos */
  .layout-horizontal .team-players { bottom: 16px; gap: 8px; }
  .layout-horizontal .pcard { width: 140px; height: 124px; border-top: 0; box-shadow: var(--depth), inset 0 4px 0 var(--side-color); }
  .layout-horizontal .pcard > .in { padding: 10px 9px 8px; gap: 4px; height: 100%; justify-content: space-between; }
  .layout-horizontal .pcard .line:nth-child(2) { flex-wrap: wrap; row-gap: 4px; min-height: 40px; align-content: flex-start; }
  .layout-horizontal .pcard .line:nth-child(2) .pweap { flex: 0 0 100%; }
  .layout-horizontal .pname { font-size: 21px; }
  .layout-horizontal .php { font-size: 26px; }
  .layout-horizontal .pweap { font-size: 16px; }
  .layout-horizontal .pmoney, .layout-horizontal .pkd { font-size: 16px; }

  .layout-vertical .team-players { gap: 7px; }
  .layout-vertical .pcard { height: 80px; border-left: 0 !important; border-right: 0 !important; }
  .layout-vertical #playersLeft .pcard { box-shadow: var(--depth), inset 6px 0 0 var(--side-color); }
  .layout-vertical #playersRight .pcard { box-shadow: var(--depth), inset -6px 0 0 var(--side-color); }
  .layout-vertical .pcard > .in { padding: 8px 14px; row-gap: 6px; }
  .layout-vertical .pname { font-size: 25px; }
  .layout-vertical .php { font-size: 28px; }
  .layout-vertical .pweap, .layout-vertical .pmoney, .layout-vertical .pkd { font-size: 17px; }

  #observed { filter: none; border-bottom: 0; border-radius: var(--radius); overflow: hidden; box-shadow: var(--depth), inset 0 -5px 0 var(--side-color); bottom: 16px; }
  #observed::after { content: ''; position: absolute; inset: 0; background: var(--gloss); pointer-events: none; }
  #observed .ob-hp .bar { border-radius: 4px; overflow: hidden; }

  #sponsors { border-left: 0; border-radius: var(--radius); box-shadow: var(--depth), inset 5px 0 0 var(--primary); background-image: var(--gloss); }

  .veto-box { border-top: 0; border-radius: 20px; overflow: hidden; box-shadow: var(--depth), inset 0 6px 0 var(--primary), 0 30px 80px rgba(0,0,0,.6); background-image: var(--gloss); }
  .veto-row { border-left: 0; border-radius: var(--radius-sm); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 5px 0 0 var(--row-color, #666), 0 2px 0 rgba(0,0,0,.3); }
  .veto-row .act { border-radius: 6px; }

  #waiting { border-radius: var(--radius-sm); box-shadow: var(--depth); }

  /* Gradiente da marca (azul da live) em todos os painéis */
  .sb-team, .pcard, #observed, #waiting { background: var(--panel-grad, var(--panel)); }
  .sb-center { background: var(--panel-grad-opaque, var(--panel-solid)); }
  .sb-center.bomb { background: #b3121f; }
  .sb-center.defuse { background: #12509e; }
  .sb-strip, #sponsors { background: var(--gloss), var(--panel-grad, var(--panel)); }
  .veto-box { background: var(--gloss), var(--panel-grad-opaque, var(--panel-solid)); }
  #roundEnd { background: var(--gloss), var(--win-color, var(--primary)); }
  .sb-main { box-shadow: var(--depth), 0 0 0 1px rgba(0,94,207,.25); }
  .sb-main::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--teamA), var(--primary) 35%, var(--accent) 50%, var(--primary) 65%, var(--teamB)); z-index: 3; }

  /* ---------- Minimapa ---------- */
  #radar { position: absolute; top: 18px; left: 18px; width: var(--radar-size, 360px); border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--depth); background: var(--gloss), var(--panel-grad, var(--panel)); }
  .rd-head { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 14px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
  .rd-head .bo { color: var(--accent); font-weight: 600; }
  .rd-head .maps { display: flex; gap: 10px; margin-left: auto; }
  .rd-head .maps span { opacity: .5; }
  .rd-head .maps span.cur { opacity: 1; color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
  .rd-map { position: relative; width: 100%; aspect-ratio: 1; background: rgba(0,0,0,.35); }
  .rd-map img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .92; }
  #rdLayer { position: absolute; inset: 0; }
  .rd-p { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; transition: left .12s linear, top .12s linear; z-index: 3; }
  .rd-p .dot { position: absolute; inset: 0; border-radius: 50%; background: var(--side-color); border: 2px solid rgba(0,0,0,.55); display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: #071423; text-shadow: none; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .rd-p .dir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: 0 0; }
  .rd-p .dir::after { content: ''; position: absolute; left: 10px; top: -5px; border-left: 8px solid var(--side-color); border-top: 5px solid transparent; border-bottom: 5px solid transparent; filter: drop-shadow(0 0 1px rgba(0,0,0,.8)); }
  .rd-p.obs { z-index: 5; }
  .rd-p.obs .dot { box-shadow: 0 0 0 3px var(--accent), 0 0 10px rgba(0,240,0,.6); }
  .rd-p.low .dot { opacity: .55; border-style: dashed; }
  .rd-p.dead { z-index: 1; }
  .rd-p.dead .dot { background: none; border: 0; box-shadow: none; color: rgba(255,255,255,.7); font-size: 16px; text-shadow: 0 1px 2px #000; }
  .rd-p.dead .dir { display: none; }
  .rd-p.bomb-carrier .dot::after { content: ''; position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; border-radius: 3px; background: #e5323b; border: 1px solid #000; }
  .rd-c4 { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; color: #fff; z-index: 4; filter: drop-shadow(0 1px 2px #000); }
  .rd-c4 svg { width: 100%; height: 100%; }
  .rd-c4.planted { color: #ff4a4a; animation: c4Beat var(--beat, 1s) ease-in-out infinite; }
  .rd-smoke { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(220,228,238,.75), rgba(200,210,222,.45) 70%, transparent 72%); transform: translate(-50%, -50%); z-index: 2; }
  .rd-fire { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: radial-gradient(circle, #ffd27a, #ff6a1a 60%, transparent 70%); z-index: 2; }
  .rd-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 15px; opacity: .7; padding: 20px; }
  #sponsors { top: var(--sponsor-top, 18px); }
  /* Minimapa limpo: só o mapa, sem cabeçalho e com fundo quase transparente */
  #radar { background: none; box-shadow: none; border-radius: 0; overflow: visible; }
  #radar .rd-head { display: none; }
  #radar .rd-map { background: rgba(0,0,0,.08); border-radius: var(--radius); }
  #radar .rd-map img { opacity: .85; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }

  /* ---------- C4 no lugar do tempo ---------- */
  .sb-c4 { position: relative; height: 46px; display: grid; place-items: center; }
  .sb-c4 .c4-ico { width: 40px; height: 40px; color: #fff; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  .sb-c4 .c4-ico svg { width: 100%; height: 100%; }
  .sb-c4.planting .c4-ico { animation: c4Spin 1.1s linear infinite; }
  .sb-c4.planted .c4-ico, .sb-c4.defusing .c4-ico { animation: c4Beat var(--beat, 1s) ease-in-out infinite; }
  .sb-c4 .c4-kit { position: absolute; right: -14px; bottom: -2px; width: 26px; height: 26px; color: #fff; animation: kitCut .5s ease-in-out infinite alternate; }
  .sb-c4 .c4-kit svg { width: 100%; height: 100%; }
  @keyframes c4Spin { to { transform: rotate(360deg); } }
  @keyframes c4Beat { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255,60,60,0)); } 50% { transform: scale(1.12); filter: drop-shadow(0 0 10px rgba(255,60,60,.9)); } }
  @keyframes kitCut { to { transform: rotate(-14deg); } }
  .sb-center.planting { background: #6b4a12 !important; box-shadow: inset 0 -4px 0 #ffb02e; }

  /* ---------- Freeze time ---------- */
  #freeze { display: flex; align-items: stretch; gap: 8px; margin-top: 8px; }
  #freeze .fz-team { display: flex; gap: 2px; border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--depth); background: var(--gloss), var(--panel-grad, var(--panel)); }
  #freeze .fz-team > div { padding: 6px 12px; text-align: center; min-width: 104px; }
  #freeze .fz-team b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #freeze .fz-team span { font-size: 11px; letter-spacing: 1.5px; opacity: .65; font-weight: 500; }
  #freeze .fz-team > div:first-child b { color: #7dff9c; }
  #freeze .fz-team.side-CT { box-shadow: var(--depth), inset 0 -3px 0 var(--ct); }
  #freeze .fz-team.side-T { box-shadow: var(--depth), inset 0 -3px 0 var(--t); }
  #freeze .fz-mid { min-width: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: var(--radius-sm); padding: 6px 12px; box-shadow: var(--depth); background: var(--gloss), var(--panel-grad-opaque, var(--panel-solid)); }
  #freeze .fz-mid span { font-size: 12px; letter-spacing: 2.5px; font-weight: 500; color: var(--accent); }
  #freeze .fz-mid b { font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  #freeze .fz-bar { width: 100%; height: 4px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 5px; overflow: hidden; }
  #freeze .fz-bar i { display: block; height: 100%; background: var(--accent); transition: width .1s linear; }

  /* ---------- MVP do round ---------- */
  #mvp { position: absolute; left: 50%; top: 44%; width: 780px; transform: translate(-50%, -50%); border-radius: 22px; overflow: hidden;
    background: var(--gloss), var(--panel-grad-opaque, var(--panel-solid));
    box-shadow: var(--depth), inset 0 0 0 2px var(--mvp-color, var(--primary)), 0 0 60px color-mix(in srgb, var(--mvp-color, var(--primary)) 45%, transparent);
    animation: mvpIn .55s cubic-bezier(.2,1.3,.4,1) both; }
  #mvp.out { animation: mvpOut .4s ease forwards; }
  @keyframes mvpIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.86); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes mvpOut { to { opacity: 0; transform: translate(-50%, -54%) scale(.96); } }
  #mvp::before { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.18) 45%, transparent 60%); transform: translateX(-100%); animation: mvpShine 1.6s .4s ease; pointer-events: none; z-index: 3; }
  @keyframes mvpShine { to { transform: translateX(100%); } }
  #mvp::after { content: ''; position: absolute; inset: 0; background: radial-gradient(500px 220px at 0% 0%, color-mix(in srgb, var(--mvp-color, var(--primary)) 40%, transparent), transparent 70%); pointer-events: none; }
  .mvp-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 24px; padding: 26px 32px 18px; }
  .mvp-top .shield { width: 118px; height: 126px; }
  .mvp-label { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #031a03; font-size: 18px; font-weight: 600; letter-spacing: 3px; padding: 3px 14px; border-radius: 8px; text-shadow: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 rgba(0,0,0,.35); }
  .mvp-label svg { width: 16px; height: 16px; }
  .mvp-round { font-size: 18px; font-weight: 500; letter-spacing: 2px; opacity: .7; margin-left: 10px; }
  .mvp-name { font-size: 76px; font-weight: 600; line-height: .95; margin-top: 8px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 560px; }
  .mvp-team { font-size: 22px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--mvp-color, var(--primary)); margin-top: 4px; filter: brightness(1.3); }
  .mvp-reason { font-size: 20px; font-weight: 600; opacity: .8; margin-top: 2px; }
  .mvp-stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 32px 16px; }
  .mvp-stat { background: rgba(0,0,0,.28); border-radius: 12px; padding: 10px 8px 8px; text-align: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.3); }
  .mvp-stat b { display: block; font-size: 46px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .mvp-stat span { font-size: 14px; font-weight: 500; letter-spacing: 2px; opacity: .65; }
  .mvp-tags { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 0 32px 24px; }
  .mvp-tag { font-size: 19px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 14px; border-radius: 9px; background: rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }
  .mvp-tag.hot { background: var(--primary); }
  .mvp-tag.gold { background: var(--accent); color: #031a03; text-shadow: none; }

  #waiting { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); font-size: 20px; letter-spacing: 3px; font-weight: 500; background: var(--panel); padding: 6px 18px; opacity: .85; }
</style>
</head>
<body>
<div id="stage" class="layout-horizontal">
  <div id="hudLayer">
    <div id="radar" class="hidden">
      <div class="rd-head" id="rdHead"></div>
      <div class="rd-map" id="rdMap"><img id="rdImg" alt=""><div id="rdLayer"></div></div>
    </div>
    <div id="sponsors" class="hidden"><span class="lbl">PATROCÍNIO</span><img id="sponsorImg" alt=""></div>

    <div id="scoreboard">
      <div class="sb-main">
        <div class="sb-team left" id="sbLeft"></div>
        <div class="sb-center" id="sbCenter">
          <div class="sb-timer" id="sbTimer">0:00</div>
          <div class="sb-c4 hidden" id="sbC4"></div>
          <div class="sb-round" id="sbRound">—</div>
        </div>
        <div class="sb-team right" id="sbRight"></div>
      </div>
      <div class="bombbar hidden" id="bombbar"><i id="bombfill"></i></div>
      <div class="sb-strip" id="sbStrip"></div>
      <div id="freeze" class="hidden"></div>
    </div>

    <div id="roundEnd" class="hidden"></div>
    <div id="mvp" class="hidden"></div>
    <div id="waiting" class="hidden">AGUARDANDO PARTIDA</div>

    <div class="team-players" id="playersLeft"></div>
    <div class="team-players" id="playersRight"></div>
    <div id="observed" class="hidden"></div>
  </div>

  <div id="veto" class="hidden"></div>
</div>

<script src="shared.js"></script>
<script src="weapons.js"></script>
<script>
let cfg = null;
let game = null;
let timerEndsAt = 0;
let timerPhase = '';
let sponsorIdx = 0;
let sponsorTimer = null;
const prevHp = {};

const $ = (id) => document.getElementById(id);

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
fit();

function fmtTime(sec) {
  sec = Math.max(0, sec);
  if (sec < 10 && timerPhase !== 'freezetime') return sec.toFixed(1);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

const PHASE_LABEL = {
  freezetime: 'COMPRA', warmup: 'AQUECIMENTO', live: '', bomb: 'BOMBA', defuse: 'DESARMANDO',
  over: 'FIM DO ROUND', paused: 'PAUSADO', timeout_ct: 'TIMEOUT CT', timeout_t: 'TIMEOUT TR',
};

function sides() {
  const a = teamASide(cfg, game);
  return { left: a, right: other(a) };
}

function seriesDots(wins) {
  const need = Math.ceil((cfg.match.bestOf || 1) / 2);
  if (need <= 1) return '';
  let h = '<span class="dots">';
  for (let i = 0; i < need; i++) h += `<i class="${i < wins ? 'on' : ''}"></i>`;
  return h + '</span>';
}

function renderScoreboard() {
  const { left, right } = sides();
  const map = game?.map || {};
  const scoreOf = (side) => (side === 'CT' ? map.team_ct?.score : map.team_t?.score) ?? 0;
  const sideLabel = (s) => (s === 'CT' ? 'CT' : 'TR');

  const team = (t, side, wins, cls) => {
    const el = $(cls);
    el.className = `sb-team ${cls === 'sbLeft' ? 'left' : 'right'} side-${side}`;
    el.style.setProperty('--team-color', t.color);
    el.innerHTML = `
      <div class="shield">${teamShield(t)}</div>
      <div class="sb-names">
        <div class="sb-name">${esc(t.name)}</div>
        <div class="sb-side">${sideLabel(side)} ${cfg.match.type === 'pro' ? seriesDots(wins) : ''}</div>
      </div>
      <div class="sb-score">${scoreOf(side)}</div>`;
  };
  team(cfg.teamA, left, cfg.match.seriesA, 'sbLeft');
  team(cfg.teamB, right, cfg.match.seriesB, 'sbRight');

  const round = (Number(map.round) || 0) + (map.phase === 'gameover' ? 0 : 1);
  const mapLbl = map.name ? mapName(map.name) : '';
  const mapNo = (cfg.match.seriesA || 0) + (cfg.match.seriesB || 0) + 1;
  const org = cfg.brand.logo ? `<img class="org" src="${esc(cfg.brand.logo)}" alt="">` : `<span>${esc(cfg.brand.orgName)}</span>`;

  let strip = `${org}<span class="sep">|</span>`;
  if (cfg.match.type === 'amador') {
    strip += `<span class="badge-amador">${esc(cfg.match.amateurLabel)}</span>`;
    if (cfg.match.amateurNote) strip += `<span>${esc(cfg.match.amateurNote)}</span>`;
  } else {
    strip += `<span>${esc(cfg.match.eventName)}</span>`;
    if (cfg.match.bestOf > 1) strip += `<span class="sep">·</span><span>MD${cfg.match.bestOf} · MAPA ${mapNo}</span>`;
  }
  if (mapLbl) strip += `<span class="sep">·</span><span>${esc(mapLbl)}</span>`;
  $('sbStrip').innerHTML = strip;

  $('sbRound').textContent = game ? `ROUND ${round}` : 'PRÉ-JOGO';
}

// Modo do centro do placar: tempo normal, C4 sendo plantada (girando) ou C4 plantada (no lugar do tempo)
let c4Mode = '';
let freezeTotal = 0;

function bombMode() {
  const s = game?.bomb?.state;
  if (s === 'planting') return 'planting';
  if (s === 'planted' || timerPhase === 'bomb') return 'planted';
  if (s === 'defusing' || timerPhase === 'defuse') return 'defusing';
  return '';
}

function renderTimer() {
  const c = $('sbCenter');
  const left = (timerEndsAt - Date.now()) / 1000;
  const bomb = game?.bomb;
  const mode = game ? bombMode() : '';

  c.classList.toggle('bomb', mode === 'planted');
  c.classList.toggle('defuse', mode === 'defusing');
  c.classList.toggle('planting', mode === 'planting');
  c.classList.toggle('freezetime', timerPhase === 'freezetime' && !mode);

  if (!game) { $('sbTimer').textContent = '—'; return; }

  // Troca o conteúdo só quando o modo muda, para não reiniciar a animação
  if (mode !== c4Mode) {
    c4Mode = mode;
    const el = $('sbC4');
    if (mode) {
      el.innerHTML = `<span class="c4-ico">${ICONS.c4}</span>${mode === 'defusing' ? `<span class="c4-kit">${ICONS.kit}</span>` : ''}`;
      el.className = `sb-c4 ${mode}`;
    } else el.className = 'sb-c4 hidden';
    $('sbTimer').classList.toggle('hidden', !!mode);
  }

  if (mode) {
    $('sbRound').textContent = mode === 'planting' ? 'PLANTANDO' : mode === 'defusing' ? 'DESARMANDO' : 'BOMBA PLANTADA';
  } else {
    $('sbTimer').textContent = timerEndsAt ? fmtTime(left) : '0:00';
    const lbl = timerPhase === 'freezetime' ? 'FREEZE TIME' : PHASE_LABEL[timerPhase];
    if (lbl) $('sbRound').textContent = lbl;
  }

  // Barra da bomba e "bipe" que acelera perto do fim
  const bb = $('bombbar');
  if (bomb && (bomb.state === 'planted' || bomb.state === 'defusing') && bomb.countdown) {
    bb.classList.remove('hidden');
    const cd = Math.max(0, Number(bomb.countdown) - (Date.now() - lastGameAt) / 1000);
    $('bombfill').style.width = `${Math.min(100, (cd / 40) * 100)}%`;
    const beat = cd > 20 ? 1 : cd > 10 ? 0.6 : cd > 5 ? 0.35 : 0.18;
    $('sbC4').style.setProperty('--beat', `${beat}s`);
  } else bb.classList.add('hidden');

  renderFreeze(left);
}

// Freeze time: tempo de compra com a economia de cada time
function lossBonus(losses) {
  return 1400 + 500 * Math.min(4, Math.max(0, losses || 0));
}

function renderFreeze(left) {
  const el = $('freeze');
  const on = game && timerPhase === 'freezetime' && !c4Mode && cfg.show.freeze !== false;
  if (!on) { el.classList.add('hidden'); freezeTotal = 0; return; }
  freezeTotal = Math.max(freezeTotal, left);
  const { left: lSide, right: rSide } = sides();
  const all = playersList(game);
  const econ = (side) => {
    const ps = all.filter((p) => p.team === side);
    const money = ps.reduce((s, p) => s + (p.state?.money || 0), 0);
    const equip = ps.reduce((s, p) => s + (p.state?.equip_value || 0), 0);
    const t = side === 'CT' ? game.map?.team_ct : game.map?.team_t;
    return { money, equip, bonus: lossBonus(t?.consecutive_round_losses) };
  };
  const a = econ(lSide), b = econ(rSide);
  const pct = freezeTotal ? Math.max(0, Math.min(100, (left / freezeTotal) * 100)) : 0;
  const fmt = (n) => '$' + n.toLocaleString('pt-BR');
  const side = (d, s) => `<div class="fz-team side-${s}">
      <div><b>${fmt(d.money)}</b><span>DINHEIRO</span></div>
      <div><b>${fmt(d.equip)}</b><span>EQUIPAMENTO</span></div>
      <div><b>${fmt(d.bonus)}</b><span>BÔNUS SE PERDER</span></div>
    </div>`;
  el.classList.remove('hidden');
  el.innerHTML = `${side(a, lSide)}
    <div class="fz-mid"><span>FREEZE TIME</span><b>${Math.floor(Math.max(0, left))}s</b><div class="fz-bar"><i style="width:${pct}%"></i></div></div>
    ${side(b, rSide)}`;
}
let lastGameAt = 0;

function playerCard(p, idx, observedId) {
  const st = p.state || {};
  const ms = p.match_stats || {};
  const w = playerWeapons(p);
  const hp = st.health ?? 0;
  const dead = hp <= 0;
  // Armas: primária e pistola; a que está na mão fica acesa, as outras apagadas.
  // Se ele estiver com faca, granada, C4 ou Zeus na mão, esse item aparece aceso no fim.
  const activeName = w.active?.name;
  const guns = [w.primary, w.secondary].filter(Boolean);
  let weap = guns.map((g) => weaponIcon(g.name, g.name === activeName ? 'on' : 'off')).join('');
  if (activeName && !guns.some((g) => g.name === activeName)) weap += weaponIcon(activeName, 'on small');
  if (dead) weap = '';
  const armor = dead ? '' : armorIcons(st);
  const extra = dead ? '' : (p.team === 'CT' && st.defusekit) ? icon('kit', 'badge') : w.bomb ? icon('c4', 'badge') : '';
  const nades = dead ? '' : w.grenades.map((g) => icon(g)).join('');

  const prev = prevHp[p.steamid] ?? hp;
  prevHp[p.steamid] = hp;

  const cls = ['pcard', `side-${p.team}`];
  if (dead) cls.push('dead');
  if (p.steamid === observedId) cls.push('observed');
  if (st.flashed > 80) cls.push('flashed');

  return `<div class="${cls.join(' ')}">
    <div class="hp-bar" style="width:${hp}%"></div>
    <div class="in">
      <div class="line"><span class="slot">${esc(p.observer_slot ?? idx)}</span><span class="pname">${esc(p.name)}</span><span class="php">${dead ? '✕' : hp}</span></div>
      <div class="line"><span class="pweap">${weap}</span><span class="nades">${nades}</span>${extra}</div>
      <div class="line"><span class="pmoney">$${st.money ?? 0}</span><span class="pkd">${ms.kills ?? 0}/${ms.assists ?? 0}/${ms.deaths ?? 0}</span><span class="armor">${armor}</span></div>
    </div>
  </div>`;
}

function renderPlayers() {
  const all = Object.entries(game?.allplayers || {}).map(([steamid, p]) => ({ steamid, ...p }));
  const { left, right } = sides();
  const observedId = game?.player?.steamid;
  const slot = (p) => (p.observer_slot === 0 ? 10 : p.observer_slot ?? 99);
  const sort = (a, b) => slot(a) - slot(b);
  const L = all.filter((p) => p.team === left).sort(sort);
  const R = all.filter((p) => p.team === right).sort(sort);
  $('playersLeft').innerHTML = L.map((p, i) => playerCard(p, i + 1, observedId)).join('');
  $('playersRight').innerHTML = R.map((p, i) => playerCard(p, i + 6, observedId)).join('');

  const ob = $('observed');
  const op = observedId && all.find((p) => p.steamid === observedId);
  if (!cfg.show.observed || !op || (op.state?.health ?? 0) <= 0) { ob.classList.add('hidden'); return; }
  const st = op.state || {};
  const ms = op.match_stats || {};
  const w = playerWeapons(op);
  const act = w.active;
  const teamCfg = op.team === left ? cfg.teamA : cfg.teamB;
  ob.className = `side-${op.team}`;
  ob.innerHTML = `
    <div class="ob-top"><div class="ob-name">${esc(op.name)}</div><div class="ob-team">${esc(teamCfg.short || teamCfg.name)}</div></div>
    <div class="ob-stats">
      <div><b>${ms.kills ?? 0}</b><span>K</span></div>
      <div><b>${ms.assists ?? 0}</b><span>A</span></div>
      <div><b>${ms.deaths ?? 0}</b><span>D</span></div>
      <div><b>${st.round_kills ?? 0}</b><span>NO ROUND</span></div>
    </div>
    <div class="ob-bottom">
      <div class="ob-hp">${st.health} HP <div class="bar"><i style="width:${st.health}%"></i></div> ${st.armor ? `<span class="ob-armor">${armorIcons(st)}${st.armor}</span>` : ''}</div>
      <div class="ob-weap">${act ? weaponIcon(act.name, 'on big') : ''}<span class="ob-wname">${esc(weaponName(act?.name))}</span>${act?.ammo_clip_max ? `<span class="ob-ammo"><b>${act.ammo_clip}</b>/${act.ammo_reserve ?? 0}</span>` : ''}</div>
    </div>`;
}

function renderRoundEnd() {
  const r = game?.round;
  const el = $('roundEnd');
  if (r?.phase === 'over' && r.win_team) {
    const { left } = sides();
    const t = r.win_team === left ? cfg.teamA : cfg.teamB;
    el.style.setProperty('--win-color', t.color);
    el.textContent = `Round para ${t.name}`;
    el.classList.remove('hidden');
  } else el.classList.add('hidden');
}

function renderVeto() {
  const el = $('veto');
  if (!cfg.show.veto) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const who = (k) => (k === 'A' ? cfg.teamA : k === 'B' ? cfg.teamB : null);
  const rows = (cfg.veto || []).map((s, i) => {
    const t = who(s.team);
    const act = s.action === 'ban' ? 'BAN' : s.action === 'pick' ? 'PICK' : 'DECIDER';
    let side = '';
    if (s.side) {
      const chooser = who(s.sideBy) || (s.team === 'A' ? cfg.teamB : cfg.teamA);
      side = `${esc(chooser.short || chooser.name)} começa ${s.side === 'CT' ? 'CT' : 'TR'}`;
    }
    return `<div class="veto-row ${s.action}" style="--row-color:${t ? esc(t.color) : 'var(--accent)'}">
      <span class="n">${i + 1}</span>
      <span class="who">${t ? `<span class="shield">${teamShield(t)}</span>${esc(t.name)}` : 'Restante'}</span>
      <span class="act ${s.action}">${act}</span>
      <span class="map">${esc(mapName(s.map) || '—')}</span>
      <span class="side">${side}</span>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="veto-box">
    <div class="veto-head">
      <div><h1>Veto de mapas</h1><div class="sub">${esc(cfg.match.type === 'amador' ? cfg.match.amateurLabel : cfg.match.eventName)} · MD${cfg.match.bestOf}</div></div>
      <div class="veto-teams"><span class="shield">${teamShield(cfg.teamA)}</span>${esc(cfg.teamA.short || cfg.teamA.name)} <span style="opacity:.4">vs</span> ${esc(cfg.teamB.short || cfg.teamB.name)}<span class="shield">${teamShield(cfg.teamB)}</span></div>
    </div>
    <div class="veto-list">${rows || '<div class="veto-row"><span></span><span>Configure o veto no painel</span></div>'}</div>
  </div>`;
}

function setupSponsors() {
  clearInterval(sponsorTimer);
  const el = $('sponsors');
  const logos = cfg.sponsors.logos || [];
  if (!cfg.show.sponsors || !cfg.sponsors.enabled || !logos.length) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const img = $('sponsorImg');
  sponsorIdx = sponsorIdx % logos.length;
  img.src = logos[sponsorIdx];
  if (logos.length > 1) {
    sponsorTimer = setInterval(() => {
      img.style.opacity = 0;
      setTimeout(() => {
        sponsorIdx = (sponsorIdx + 1) % logos.length;
        img.src = logos[sponsorIdx];
        img.style.opacity = 1;
      }, 500);
    }, Math.max(3, cfg.sponsors.interval || 8) * 1000);
  }
}

function renderAll() {
  if (!cfg) return;
  applyTheme(cfg);
  $('stage').className = `layout-${cfg.layout === 'vertical' ? 'vertical' : 'horizontal'}`;
  $('hudLayer').classList.toggle('hidden', !cfg.show.hud);
  $('waiting').classList.toggle('hidden', !!game);
  renderScoreboard();
  renderPlayers();
  renderRadar();
  renderRoundEnd();
  renderTimer();
}

/* ---------- MVP do round ----------
   O CS2 soma 1 em match_stats.mvps do jogador no fim do round. O HUD guarda o valor
   anterior e, quando ele sobe, mostra o destaque. Durante o round o HUD também anota
   quem fez a primeira kill e quem ficou sozinho contra vários (clutch). */
/* ---------- Minimapa ----------
   As imagens e as coordenadas vêm de public/maps (gerado por tools/extrair-radares.js).
   Posição na imagem: x = (X - pos_x) / scale ; y = (pos_y - Y) / scale (em pixels de 1024). */
let MAPINFO = {};
fetch('/maps/maps.json').then((r) => r.json()).then((m) => { MAPINFO = m || {}; if (cfg) renderAll(); }).catch(() => {});
const lastPos = {}; // última posição conhecida (para marcar onde o jogador morreu)
let radarImgFor = '';

function vec(s) {
  const v = String(s || '').split(',').map(Number);
  return v.length >= 2 && v.every((n) => !Number.isNaN(n)) ? v : null;
}

function toRadar(info, p) {
  const size = info.size || 1024;
  return [((p[0] - info.pos_x) / info.scale / size) * 100, ((info.pos_y - p[1]) / info.scale / size) * 100];
}

function seriesMaps() {
  return (cfg.veto || []).filter((s) => (s.action === 'pick' || s.action === 'decider') && s.map).map((s) => s.map);
}

function renderRadar() {
  const box = $('radar');
  const mapId = game?.map?.name;
  const info = MAPINFO[mapId];
  const show = cfg.show.radar !== false && !!game;
  box.classList.toggle('hidden', !show);
  const size = Number(cfg.radar?.size) || 360;
  $('stage').style.setProperty('--radar-size', size + 'px');
  $('stage').style.setProperty('--sponsor-top', show ? `${18 + size + 10}px` : '18px');
  if (!show) return;

  // Cabeçalho: série e mapas
  const maps = seriesMaps();
  const bo = cfg.match.bestOf > 1 ? `MD${cfg.match.bestOf}` : 'MAPA';
  const list = (maps.length ? maps : [mapId]).map((m) => `<span class="${m === mapId ? 'cur' : ''}">${esc(mapName(m))}</span>`).join('');
  $('rdHead').innerHTML = `<span class="bo">${bo}</span><span class="maps">${list}</span>`;

  const layer = $('rdLayer');
  if (!info) {
    $('rdImg').style.display = 'none';
    layer.innerHTML = `<div class="rd-empty">Radar de ${esc(mapName(mapId) || 'mapa desconhecido')} não encontrado.<br>Rode: node tools/extrair-radares.js</div>`;
    return;
  }
  if (radarImgFor !== mapId) { $('rdImg').src = info.image; $('rdImg').style.display = ''; radarImgFor = mapId; }

  const observedId = game.player?.steamid;
  const { left } = sides();
  let html = '';

  // Granadas: smokes e fogo
  for (const g of Object.values(game.grenades || game.allgrenades || {})) {
    if (g.type === 'smoke' && Number(g.effecttime) > 0) {
      const p = vec(g.position);
      if (!p) continue;
      const [x, y] = toRadar(info, p);
      const d = ((288 / info.scale) / (info.size || 1024)) * 100; // smoke tem ~144 unidades de raio
      html += `<div class="rd-smoke" style="left:${x}%;top:${y}%;width:${d}%;height:${d}%"></div>`;
    }
    if (g.type === 'inferno' && g.flames) {
      for (const f of Object.values(g.flames)) {
        const p = vec(f);
        if (!p) continue;
        const [x, y] = toRadar(info, p);
        html += `<div class="rd-fire" style="left:${x}%;top:${y}%"></div>`;
      }
    }
  }

  // Jogadores
  for (const p of playersList(game)) {
    const st = p.state || {};
    const dead = (st.health || 0) <= 0;
    let pos = vec(p.position);
    if (!dead && pos) lastPos[p.steamid] = pos;
    if (dead) pos = lastPos[p.steamid];
    if (!pos) continue;
    const [x, y] = toRadar(info, pos);
    const fw = vec(p.forward);
    const ang = fw ? (-Math.atan2(fw[1], fw[0]) * 180) / Math.PI : 0;
    const low = info.lowerBelowZ !== undefined && pos[2] < info.lowerBelowZ;
    const hasBomb = Object.values(p.weapons || {}).some((w) => w.type === 'C4');
    const cls = ['rd-p', `side-${p.team}`];
    if (dead) cls.push('dead');
    if (p.steamid === observedId) cls.push('obs');
    if (low) cls.push('low');
    if (hasBomb && !dead) cls.push('bomb-carrier');
    const slot = p.observer_slot === undefined ? '' : p.observer_slot;
    html += `<div class="${cls.join(' ')}" style="left:${x}%;top:${y}%" title="${esc(p.name)}">
      <div class="dir" style="transform:rotate(${ang}deg)"></div><div class="dot">${dead ? '✕' : esc(slot)}</div></div>`;
  }

  // Bomba caída ou plantada
  const b = game.bomb;
  if (b && (b.state === 'dropped' || b.state === 'planted' || b.state === 'defusing' || b.state === 'planting')) {
    const p = vec(b.position);
    if (p) {
      const [x, y] = toRadar(info, p);
      html += `<div class="rd-c4 ${b.state === 'dropped' ? '' : 'planted'}" style="left:${x}%;top:${y}%">${ICONS.c4}</div>`;
    }
  }
  layer.innerHTML = html;
}

const prevMvps = {};
let mvpTimer = null;
let lastPhase = '';
let track = newTrack();

function newTrack() {
  return { firstKill: null, clutch: { CT: null, T: null }, shown: false };
}

function playersList(g) {
  return Object.entries(g?.allplayers || {}).map(([steamid, p]) => ({ steamid, ...p }));
}

function trackRound(g) {
  const phase = g.round?.phase || '';
  if (phase === 'freezetime' && lastPhase !== 'freezetime') track = newTrack();
  lastPhase = phase;

  const all = playersList(g);
  if (phase === 'live') {
    if (!track.firstKill) {
      const fk = all.find((p) => (p.state?.round_kills || 0) > 0);
      if (fk) track.firstKill = fk.steamid;
    }
    for (const side of ['CT', 'T']) {
      const mine = all.filter((p) => p.team === side && (p.state?.health || 0) > 0);
      const enemies = all.filter((p) => p.team !== side && (p.state?.health || 0) > 0).length;
      if (mine.length === 1 && enemies >= 1) {
        const c = track.clutch[side];
        if (!c || c.steamid !== mine[0].steamid) track.clutch[side] = { steamid: mine[0].steamid, vs: enemies };
        else c.vs = Math.max(c.vs, enemies);
      }
    }
  }

  for (const p of all) {
    const now = Number(p.match_stats?.mvps) || 0;
    const before = prevMvps[p.steamid];
    prevMvps[p.steamid] = now;
    if (before !== undefined && now > before && !track.shown) {
      track.shown = true;
      showMvp(p, g);
    }
  }
}

const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>';

function mvpData(p, g) {
  const st = p.state || {};
  const kills = st.round_kills || 0;
  const hs = st.round_killhs || 0;
  const dmg = st.round_totaldmg;
  const tags = [];
  if (kills >= 5) tags.push(['ACE', 'gold']);
  else if (kills >= 2) tags.push([`${kills}K`, 'hot']);
  const c = track.clutch[p.team];
  // Clutch só conta se ele venceu o round e terminou vivo
  const won = g.round?.win_team === p.team && (st.health || 0) > 0;
  if (c && c.steamid === p.steamid && won && c.vs >= 1) tags.push([`Clutch 1v${c.vs}`, 'gold']);
  if (track.firstKill === p.steamid) tags.push(['Primeira kill', '']);
  if (kills > 0 && hs === kills) tags.push(['Só headshot', '']);
  if ((st.health || 0) > 0) tags.push(['Sobreviveu', '']);

  let reason = 'Mais eliminações do round';
  if (g.round?.bomb === 'defused' && p.team === 'CT') reason = 'Desarmou a bomba';
  else if (g.round?.bomb === 'exploded' && p.team === 'T') reason = 'Plantou a bomba';
  if (c && c.steamid === p.steamid && won && c.vs >= 2) reason = `Venceu o clutch contra ${c.vs}`;

  return { kills, hs, dmg, hp: st.health || 0, tags, reason };
}

function showMvp(p, g) {
  if (!cfg || !cfg.show.mvp) return;
  const { left } = sides();
  const team = p.team === left ? cfg.teamA : cfg.teamB;
  const d = mvpData(p, g);
  // Número do round que acabou = soma dos placares (não depende de quando o jogo atualiza map.round)
  const round = (Number(g.map?.team_ct?.score) || 0) + (Number(g.map?.team_t?.score) || 0) || 1;
  const el = $('mvp');
  el.style.setProperty('--mvp-color', team.color);
  el.innerHTML = `
    <div class="mvp-top">
      <div class="shield">${teamShield(team)}</div>
      <div style="min-width:0;flex:1">
        <div><span class="mvp-label">${STAR} MVP DO ROUND</span><span class="mvp-round">ROUND ${round}</span></div>
        <div class="mvp-name">${esc(p.name)}</div>
        <div class="mvp-team">${esc(team.name)} · ${p.team === 'CT' ? 'CT' : 'TR'}</div>
        <div class="mvp-reason">${esc(d.reason)}</div>
      </div>
    </div>
    <div class="mvp-stats">
      <div class="mvp-stat"><b>${d.kills}</b><span>KILLS</span></div>
      <div class="mvp-stat"><b>${d.hs}</b><span>HEADSHOTS</span></div>
      <div class="mvp-stat"><b>${d.dmg ?? '—'}</b><span>DANO</span></div>
      <div class="mvp-stat"><b>${d.hp > 0 ? d.hp : '✕'}</b><span>HP FINAL</span></div>
    </div>
    <div class="mvp-tags">${d.tags.map(([t, c]) => `<span class="mvp-tag ${c}">${esc(t)}</span>`).join('')}</div>`;

  clearTimeout(mvpTimer);
  el.classList.remove('hidden', 'out');
  void el.offsetWidth; // reinicia a animação
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
  const secs = Math.max(2, Number(cfg.mvp?.duration) || 6);
  mvpTimer = setTimeout(() => {
    el.classList.add('out');
    mvpTimer = setTimeout(() => el.classList.add('hidden'), 400);
  }, secs * 1000);
}

// Teste pelo painel: usa o jogador observado (ou o primeiro da lista) com dados de exemplo
function testMvp() {
  const all = playersList(game);
  const base = all.find((p) => p.steamid === game?.player?.steamid) || all[0] ||
    { steamid: 'teste', name: 'Jogador Teste', team: 'CT', state: {}, match_stats: {} };
  const fake = { ...base, state: { ...base.state, round_kills: 3, round_killhs: 2, round_totaldmg: 287, health: 64 } };
  const saved = track;
  track = { firstKill: fake.steamid, clutch: { CT: null, T: null, [fake.team]: { steamid: fake.steamid, vs: 2 } }, shown: true };
  showMvp(fake, { ...(game || {}), round: { phase: 'over', win_team: fake.team } });
  track = saved;
}

const es = new EventSource('/events');
es.addEventListener('mvptest', () => testMvp());
es.addEventListener('config', (e) => {
  cfg = JSON.parse(e.data);
  renderAll();
  renderVeto();
  setupSponsors();
});
es.addEventListener('game', (e) => {
  game = JSON.parse(e.data);
  lastGameAt = Date.now();
  const pc = game.phase_countdowns;
  if (pc && pc.phase_ends_in !== undefined) {
    timerEndsAt = Date.now() + Number(pc.phase_ends_in) * 1000;
    timerPhase = pc.phase;
  }
  if (cfg) trackRound(game);
  renderAll();
});

setInterval(() => { if (cfg) renderTimer(); }, 100);
</script>
</body>
</html>
